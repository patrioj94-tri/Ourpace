<title>Our Pace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E7EEEE; --surface:#FFFFFF; --surface-2:#F1F6F6; --line:#D4DFDF;
  --ink:#0E2226; --muted:#5B7479; --faint:#8CA1A5;
  --accent:#D64F17; --accent-soft:#FBE6DC;
  --swim:#0083A0; --bike:#8A4FC4; --run:#D64F17; --strength:#516366; --rest:#8CA1A5; --other:#5B7479;
  --ok:#2A7350; --ok-soft:#DEEFE6; --miss:#A3353D; --miss-soft:#F7E1E2;
  --shadow:0 1px 2px rgba(14,34,38,.05), 0 8px 22px rgba(14,34,38,.06);
  --r:14px;
  --display:Archivo,"Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#07161A; --surface:#0F2328; --surface-2:#152C31; --line:#23414A;
  --ink:#E6EFEF; --muted:#90A9AE; --faint:#6D888E;
  --accent:#FF7C46; --accent-soft:#3A1F14;
  --swim:#2B96BC; --bike:#8F68D6; --run:#EE5F26; --strength:#8FA9AE; --rest:#6D888E; --other:#90A9AE;
  --ok:#5DBE8A; --ok-soft:#11322A; --miss:#E78990; --miss-soft:#381E21;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#07161A; --surface:#0F2328; --surface-2:#152C31; --line:#23414A;
  --ink:#E6EFEF; --muted:#90A9AE; --faint:#6D888E;
  --accent:#FF7C46; --accent-soft:#3A1F14;
  --swim:#2B96BC; --bike:#8F68D6; --run:#EE5F26; --strength:#8FA9AE; --rest:#6D888E; --other:#90A9AE;
  --ok:#5DBE8A; --ok-soft:#11322A; --miss:#E78990; --miss-soft:#381E21;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.shell{max-width:440px;margin:0 auto;min-height:100%;background:var(--surface);border-inline:1px solid var(--line);display:flex;flex-direction:column}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px 12px;display:flex;align-items:center;gap:10px}
.wordmark{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.03em;margin:0}
.wordmark span{color:var(--accent)}
.savebadge{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}
.savebadge[data-on="true"]{color:var(--ok);border-color:currentColor}
main{flex:1;padding:18px 18px 104px}
.view[hidden]{display:none!important}
h2{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:15.5px;letter-spacing:-.01em;margin:0 0 5px;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.note{margin:18px 0 0;font-size:12.5px;color:var(--faint);line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r)}

.race{display:flex;align-items:flex-end;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.race .num{font-family:var(--display);font-weight:800;font-size:46px;line-height:.9;letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.race .meta{padding-bottom:4px}
.race .meta b{display:block;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:-.01em}
.race .meta span{font-family:var(--mono);font-size:11px;color:var(--muted);display:block}

.switch{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px}
.switch button{flex:1;border-radius:999px;padding:7px 4px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.switch button[data-active="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.vol{display:flex;flex-direction:column;gap:9px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r)}
.volrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px}
.volrow .lab{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.volrow .fig{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.volrow .fig b{color:var(--ink);font-weight:600}

.weeknav{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.weeknav button{flex:1;border:1px solid currentColor;color:var(--accent);border-radius:10px;padding:9px 8px;font-family:var(--display);font-weight:600;font-size:13.5px;white-space:nowrap}
.weeklabel{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin:10px 0 0}

.day{margin-top:16px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dayhead .dow{font-family:var(--display);font-weight:700;font-size:13px}
.dayhead .date{font-family:var(--mono);font-size:11px;color:var(--faint)}
.dayhead .today{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 7px}
.sess{display:grid;grid-template-columns:3px 1fr auto;gap:12px;align-items:start;padding:11px 0}
.sess+.sess{border-top:1px dashed var(--line)}
.sess .stripe{border-radius:999px;align-self:stretch;min-height:34px}
.sess .title{font-weight:600;font-size:14.5px;margin:0 0 2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.disc{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.sess .target{margin:0;font-size:13px;color:var(--muted)}
.proof{margin:6px 0 0;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:5px 8px;display:inline-block}
.proof.bad{color:var(--miss);background:var(--miss-soft)}
.mark{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;flex:none;border:1.5px solid var(--line);padding:0}
.mark.done{background:var(--ok);border-color:var(--ok)}
.mark.missed{border-color:var(--miss);color:var(--miss)}
.mark.now{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.todo{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.box{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px;padding:0;transition:background .15s,border-color .15s}
.todo[data-done="true"] .box{background:var(--ok);border-color:var(--ok)}
.todo[data-done="true"] .tx b{text-decoration:line-through;color:var(--faint);text-decoration-thickness:1.5px}
.tx{flex:1;min-width:0;text-align:left}
.tx b{display:block;font-weight:600;font-size:14.5px}
.tx span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.who{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;border-radius:999px;padding:3px 7px;flex:none;margin-top:2px}
.del{color:var(--faint);font-size:17px;line-height:1;padding:2px 4px;flex:none}

.dream{border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.dream p{margin:0;font-size:13.5px;color:var(--muted)}
.dreamtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.dreamtop .eyebrow{margin:0}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
.chip.booked,.chip.done{color:var(--ok);border-color:currentColor}
.chip.planning{color:var(--accent);border-color:currentColor}

.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:18px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);text-align:center}
.score .n{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score .nm{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px;display:block}
.score .vs{font-family:var(--mono);font-size:11px;color:var(--faint)}
.game{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.game b{font-weight:600;font-size:14.5px;display:block}
.game .last{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.tally{display:flex;align-items:center;gap:6px}
.tally .v{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;min-width:18px;text-align:center}
.tally .sep{color:var(--faint);font-family:var(--mono)}
.tally button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);font-size:16px;line-height:1;color:var(--muted)}

.addrow{display:flex;gap:8px;margin:14px 0 4px}
.addrow input,.addrow select{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:16px}
.addrow input::placeholder{color:var(--faint)}
.btn{background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:14px;flex:none}
.btn:disabled{opacity:.5}

.notecard{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:14px 16px;background:var(--surface-2)}
.notecard p{margin:0;font-size:14px;line-height:1.6}

.calday{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.calday .when{font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.35;padding-top:2px}
.calday .when b{display:block;font-family:var(--display);font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.calday.is-today .when b{color:var(--accent)}
.ev{display:flex;gap:9px;align-items:baseline;padding:4px 0}
.dot{width:7px;height:7px;border-radius:999px;flex:none;transform:translateY(-1px)}
.ev .txt{flex:1;min-width:0}
.ev .txt b{display:block;font-weight:600;font-size:14px}
.ev .txt span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:12px 0 2px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:999px;margin-right:5px}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;color:var(--faint);transition:color .15s}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase}
.tabbar svg{display:block}
</style>

</div>

  const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const LABEL = { swim: "Swim", bike: "Bike", run: "Run", strength: "Strength", rest: "Rest", other: "Other" };

  /* ---------------------------------------------------------- dates ---- */
  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const today = () => iso(new Date());
  const mondayOf = (s) => addDays(s, -((parse(s).getDay() + 6) % 7));
  const dayName = (s) => DOW[(parse(s).getDay() + 6) % 7];
  const shortDate = (s) => { const d = parse(s); return d.getDate() + " " + MONTH[d.getMonth()]; };
  const longDate = (s) => { const d = parse(s); return dayName(s) + " " + d.getDate() + " " + MONTH[d.getMonth()] + " " + d.getFullYear(); };
  const daysUntil = (s) => Math.round((parse(s) - parse(today())) / 86400000);

  const clock = (sec) => {
    if (!sec) return "—";
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
    const p = (n) => String(n).padStart(2, "0");
    return h ? h + ":" + p(m) + ":" + p(s) : m + ":" + p(s);
  };
  const km = (m, dp) => !m ? "—" : (m / 1000).toFixed(dp === undefined ? 2 : dp) + " km";

  /* ------------------------------------------------- the same matcher --- */
  /* Kept deliberately in step with src/lib/match.ts in the repository.     */
  function scoreMatch(a, s, when) {
    if (a.d !== s.d) return null;
    const ad = a.start.slice(0, 10);
    const off = Math.abs((Date.parse(ad + "T00:00:00") - Date.parse(s.date + "T00:00:00")) / 86400000);
    if (off > 1) return null;
    if (off > 0 && s.date >= when) return null;   // its own day has not come yet
    let score = 100 - off * 20;
    if (s.m && a.m) {
      const r = a.m / s.m;
      if (r < 0.5) return null;
      score -= Math.min(40, Math.abs(1 - r) * 60);
    } else if (s.s && a.sec) {
      const r = a.sec / s.s;
      if (r < 0.5) return null;
      score -= Math.min(s.d === "strength" ? 15 : 40, Math.abs(1 - r) * 60);

    return Math.max(0, Math.round(score));
  }

  function computeMatches() {
    const hits = new Map();     // sessionKey -> activity
    for (const person of PEOPLE) {
      const mine = sessionsFor(person.id);
      const acts = (state.activities[person.id] || []).slice().sort((a, b) => a.start.localeCompare(b.start));
      const taken = new Set(), used = new Set();
      for (const s of mine) {
        const ov = state.overrides[keyOf(s, person.id)];
        if (ov && ov.status === "done") taken.add(s.i);
      }
      const run = (when) => {
        for (const a of acts) {
          if (used.has(a.id)) continue;
          let best = null;
          for (const s of mine) {
            if (taken.has(s.i)) continue;
            const sc = scoreMatch(a, s, when(a));
            if (sc !== null && (!best || sc > best.score)) best = { s, score: sc };
          }
          if (best && best.score >= CONFIDENT) {
            taken.add(best.s.i); used.add(a.id);
            hits.set(keyOf(best.s, person.id), a);
          }
        }
      };
      run((a) => a.start.slice(0, 10));
      run(() => today());
    }
    return hits;
  }

  function statusOf(session, personId) {
    const ov = state.overrides[keyOf(session, personId)];
    if (ov) return ov.status;
    if (state.matches.has(keyOf(session, personId))) return "done";
    if (session.date < addDays(today(), -2)) return "missed";
    return "planned";
  }

  function proofFor(a) {
    const bits = ["Strava"];
    if (!a.m) { bits.push(clock(a.sec)); return bits.join(" · "); }
    bits.push(km(a.m), clock(a.sec));
    if (a.d === "run") bits.push(clock(a.sec / (a.m / 1000)) + " /km");
    else if (a.d === "swim") bits.push(clock(a.sec / (a.m / 100)) + " /100 m");
    else if (a.d === "bike") bits.push((a.m / a.sec * 3.6).toFixed(1) + " km/h");
    return bits.join(" · ");
  }

  /* ------------------------------------------------------------ state --- */
  const state = {
    tab: "training",
    who: "patri",
    week: null,
    db: null,
    overrides: {},
    activities: { patri: [], jean: [] },
    todos: [],
    dreams: [],
    games: [],
    battles: [],
    matches: new Map(),
  };

  const weekHasSessions = (w) => DATA.sessions.some((s) => s.date >= w && s.date <= addDays(w, 6));
  function openingWeek() {
    const now = mondayOf(today());
    if (weekHasSessions(now)) return now;
    // Nothing planned this week — open on the nearest week that has something.
    let best = DATA.weeks[0], gap = Infinity;
    for (const w of DATA.weeks) {
      const d = Math.abs(parse(w) - parse(now));
      if (d < gap) { gap = d; best = w; }
    }
    return best;
  }
  state.week = openingWeek();

  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const TICK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
  const TICKD = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
  const CROSS = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const DOT = '<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>';
  const nameOf = (id) => (PEOPLE.find((p) => p.id === id) || {}).name || "Us";
  const colorOf = (id) => (PEOPLE.find((p) => p.id === id) || {}).color || "accent";

  /* --------------------------------------------------------- training --- */
  function renderTraining() {
    const days = Array.from({ length: 7 }, (_, i) => addDays(state.week, i));
    const mine = sessionsFor(state.who).filter((s) => s.date >= state.week && s.date <= addDays(state.week, 6));
    const d = daysUntil(RACE.date);

    let html = '<div class="stack">'
      + '<div class="race"><div class="num">' + (d > 0 ? d : 0) + '</div><div class="meta">'
      + '<b>' + esc(RACE.name) + '</b><span>' + longDate(RACE.date) + '</span><span>' + esc(RACE.location) + '</span>'
      + '</div></div>'
      + '<div class="switch" role="group" aria-label="Whose week">'
      + PEOPLE.map((p) => '<button type="button" data-who="' + p.id + '" data-active="' + (p.id === state.who) + '">' + p.name + '</button>').join("")
      + '</div>';

    const order = ["swim", "bike", "run", "strength"];
    const rows = order.map((disc) => {
      const list = mine.filter((s) => s.d === disc);
      if (!list.length) return null;
      const done = list.filter((s) => statusOf(s, state.who) === "done");
      const dist = done.reduce((t, s) => t + ((state.matches.get(keyOf(s, state.who)) || {}).m || 0), 0);
      const secs = done.reduce((t, s) => t + ((state.matches.get(keyOf(s, state.who)) || {}).sec || 0), 0);
      return '<div class="volrow"><span class="lab">' + LABEL[disc] + '</span>'
        + '<span class="bar"><i style="width:' + Math.round(done.length / list.length * 100) + '%;background:var(--' + disc + ')"></i></span>'
        + '<span class="fig"><b>' + done.length + '</b>/' + list.length + ' · ' + (dist ? km(dist, 1) : clock(secs)) + '</span></div>';
    }).filter(Boolean);
    if (rows.length) html += '<div class="vol">' + rows.join("") + '</div>';
    html += '</div>';

    html += '<div class="weeknav">'
      + '<button type="button" data-week="prev">← Last week</button>'
      + (state.week !== mondayOf(today()) && weekHasSessions(mondayOf(today())) ? '<button type="button" data-week="now">This week</button>' : '')
      + '<button type="button" data-week="next">Next week →</button></div>'
      + '<p class="weeklabel">' + shortDate(state.week) + ' – ' + shortDate(addDays(state.week, 6)) + ' ' + parse(state.week).getFullYear()
      + (mine.length && mine[0].wk ? ' · week ' + mine[0].wk + ' of 40 · ' + mine[0].ph : '') + '</p>';

    if (!mine.length) {
      // Between the pre-season weeks and January there is a long gap. Offer a
      // way across it rather than fifteen taps on "next week".
      const target = DATA.weeks.find((w) => w > state.week) || DATA.weeks[DATA.weeks.length - 1];
      html += '<div class="empty" style="margin-top:18px">Nothing planned this week.'
        + '<br><br><button type="button" class="btn" data-jump="' + target + '">Jump to ' + shortDate(target) + ' \u2192</button></div>';
    }

    for (const day of days) {
      const list = mine.filter((s) => s.date === day);
      if (!list.length) continue;
      html += '<section class="day"><div class="dayhead"><span class="dow">' + dayName(day) + '</span>'
        + '<span class="date">' + shortDate(day) + '</span>'
        + (day === today() ? '<span class="today">Today</span>' : '') + '</div>';
      for (const s of list) {
        const st = statusOf(s, state.who);
        const act = state.matches.get(keyOf(s, state.who));
        const cls = st === "done" ? "mark done" : st === "missed" ? "mark missed" : day === today() ? "mark now" : "mark";
        const inner = st === "done" ? TICK : st === "missed" ? CROSS : day === today() ? DOT : "";
        html += '<div class="sess"><span class="stripe" style="background:var(--' + s.d + ')"></span><div>'
          + '<p class="title">' + esc(s.t) + '<span class="disc" style="color:var(--' + s.d + ')">' + LABEL[s.d] + '</span></p>'
          + (s.g ? '<p class="target">' + esc(s.g) + '</p>' : '')
          + (st === "done" && act ? '<p class="proof">' + esc(proofFor(act)) + '</p>' : '')
          + (st === "done" && !act ? '<p class="proof">Ticked off by hand</p>' : '')
          + (st === "missed" ? '<p class="proof bad">Nothing on Strava for this one</p>' : '')
          + '</div><button type="button" class="' + cls + '" data-tick="' + esc(keyOf(s, state.who)) + '" data-st="' + st + '" aria-label="'
          + (st === "done" ? "Done. Tap to un-tick." : "Not done yet. Tap to tick it off.") + '">' + inner + '</button></div>';
      }
      html += '</section>';
    }

    html += '<p class="note">Sessions tick themselves off from Strava. Tap a circle to override it by hand — that is saved, and Jean sees it too.</p>';
    document.getElementById("v-training").innerHTML = html;
  }

  /* --------------------------------------------------------- calendar --- */
  function renderCalendar() {
    const days = Array.from({ length: 7 }, (_, i) => addDays(state.week, i));
    let html = '<p class="eyebrow">' + shortDate(state.week) + " — " + shortDate(addDays(state.week, 6)) + '</p>'
      + '<h2>This week, both of us</h2>'
      + '<p class="sub">The training for the two of you, side by side.</p>'
      + '<div class="legend">' + PEOPLE.map((p) => '<span><i style="background:var(--' + p.color + ')"></i>' + p.name + '</span>').join("") + '</div><div>';

    let any = false;
    for (const day of days) {
      const items = [];
      for (const p of PEOPLE) {
        for (const s of sessionsFor(p.id).filter((x) => x.date === day)) items.push({ p, s });
      }
      if (!items.length) continue;
      any = true;
      html += '<div class="calday' + (day === today() ? " is-today" : "") + '"><div class="when"><b>' + parse(day).getDate() + '</b>' + dayName(day) + '</div><div>';
      for (const { p, s } of items) {
        html += '<div class="ev"><i class="dot" style="background:var(--' + p.color + ')"></i><div class="txt"><b>' + esc(s.t) + '</b>'
          + '<span>' + p.name + " · " + LABEL[s.d] + (s.g ? " · " + esc(s.g) : "") + '</span></div></div>';
      }
      html += '</div></div>';
    }
    html += '</div>';
    if (!any) html += '<div class="empty">Nothing this week.</div>';
    html += '<div class="weeknav"><button type="button" data-week="prev">← Last week</button><button type="button" data-week="next">Next week →</button></div>'
      + '<p class="note">Your real Google calendars merge in here once the app is deployed — that part needs a server, so it is not in this preview.</p>';
    document.getElementById("v-calendar").innerHTML = html;
  }

  /* ------------------------------------------------------------ to-do --- */
  function renderTodos() {
    let html = '<p class="eyebrow">Shared list</p><h2>Things we need to do</h2>'
      + '<p class="sub">Tap to tick. Whoever does it, the other one sees it.</p>'
      + '<form class="addrow" id="add-todo"><input id="todo-text" placeholder="Something we need to do" aria-label="New to-do">'
      + '<select id="todo-who" aria-label="Who it is for" style="flex:0 0 88px"><option value="">Us</option>'
      + PEOPLE.map((p) => '<option value="' + p.id + '">' + p.name + '</option>').join("")
      + '</select><button class="btn" type="submit">Add</button></form>';

    if (!state.todos.length) html += '<div class="empty" style="margin-top:16px">Nothing on the list. Enjoy it.</div>';
    html += '<div style="margin-top:10px">' + state.todos.map((t, i) =>
      '<div class="todo" data-done="' + !!t.done + '">'
      + '<button type="button" class="box" data-todo="' + i + '" aria-label="' + (t.done ? "Un-tick" : "Tick off") + ' ' + esc(t.body) + '">' + (t.done ? TICK : "") + '</button>'
      + '<div class="tx"><b>' + esc(t.body) + '</b><span>' + (t.due ? shortDate(t.due) : "No date") + (t.done && t.by ? " · done by " + esc(nameOf(t.by)) : "") + '</span></div>'
      + '<span class="who" style="color:var(--' + colorOf(t.who) + ');background:color-mix(in srgb, var(--' + colorOf(t.who) + ') 13%, transparent)">' + esc(nameOf(t.who)) + '</span>'
      + '<button type="button" class="del" data-deltodo="' + i + '" aria-label="Delete ' + esc(t.body) + '">×</button></div>').join("") + '</div>';
    document.getElementById("v-todo").innerHTML = html;
  }

  /* ----------------------------------------------------------- dreams --- */
  const STATES = ["someday", "planning", "booked", "done"];
  const SLABEL = { someday: "Someday", planning: "Planning", booked: "Booked", done: "Done" };
  function renderDreams() {
    let html = '<p class="eyebrow">Let’s dream together</p><h2>Things we said we’d do one day</h2>'
      + '<p class="sub">No deadlines. Just somewhere they don’t get lost in a chat.</p>'
      + '<form class="addrow" id="add-dream"><input id="dream-text" placeholder="Something we said we’d do" aria-label="New dream">'
      + '<button class="btn" type="submit">Add</button></form>';
    if (!state.dreams.length) html += '<div class="empty" style="margin-top:16px">Nothing here yet.</div>';
    html += '<div class="stack" style="margin-top:16px">' + state.dreams.map((d, i) =>
      '<article class="dream"><div class="dreamtop"><p class="eyebrow">' + esc(d.category || "Us") + '</p>'
      + '<button type="button" class="chip ' + d.state + '" data-dream="' + i + '" aria-label="' + SLABEL[d.state] + '. Tap to move it on.">' + SLABEL[d.state] + '</button></div>'
      + '<h3>' + esc(d.title) + '</h3>' + (d.note ? '<p>' + esc(d.note) + '</p>' : '') + '</article>').join("") + '</div>';
    document.getElementById("v-dreams").innerHTML = html;
  }

  /* ---------------------------------------------------------- battles --- */
  function renderBattles() {
    const [a, b] = PEOPLE;
    const count = (pid) => state.battles.filter((x) => x.winner === pid).length;
    const ta = count(a.id), tb = count(b.id);
    const lead = ta === tb ? "Dead level." : ta > tb ? a.name + " leads by " + (ta - tb) + "." : b.name + " leads by " + (tb - ta) + ".";

    let html = '<p class="eyebrow">Head to head</p><h2>Game battles</h2>'
      + '<div class="score" style="margin-top:14px">'
      + '<div><div class="n" style="color:var(--' + a.color + ')">' + ta + '</div><span class="nm">' + a.name + '</span></div>'
      + '<div class="vs">vs</div>'
      + '<div><div class="n" style="color:var(--' + b.color + ')">' + tb + '</div><span class="nm">' + b.name + '</span></div></div>'
      + '<p class="sub" style="margin-top:12px">' + lead + " " + state.battles.length + ' games logged.</p><div style="margin-top:8px">';

    for (const g of state.games) {
      const played = state.battles.filter((x) => x.game === g.id).sort((x, y) => y.on.localeCompare(x.on));
      const last = played[0];
      html += '<div class="game"><div><b>' + (g.emoji ? esc(g.emoji) + " " : "") + esc(g.name) + '</b>'
        + '<span class="last">' + (last ? "Last: " + esc(nameOf(last.winner)) + ", " + shortDate(last.on) : "Never played") + '</span></div>'
        + '<div class="tally">'
        + '<button type="button" data-win="' + esc(g.id) + '|' + a.id + '" style="color:var(--' + a.color + ')" aria-label="' + a.name + ' won at ' + esc(g.name) + '">+</button>'
        + '<span class="v" style="color:var(--' + a.color + ')">' + played.filter((x) => x.winner === a.id).length + '</span>'
        + '<span class="sep">–</span>'
        + '<span class="v" style="color:var(--' + b.color + ')">' + played.filter((x) => x.winner === b.id).length + '</span>'
        + '<button type="button" data-win="' + esc(g.id) + '|' + b.id + '" style="color:var(--' + b.color + ')" aria-label="' + b.name + ' won at ' + esc(g.name) + '">+</button>'
        + '</div></div>';
    }
    html += '</div><form class="addrow" id="add-game" style="margin-top:18px"><input id="game-name" placeholder="Add a game" aria-label="New game"><button class="btn" type="submit">Add</button></form>';
    document.getElementById("v-battles").innerHTML = html;
  }

  const RENDER = { training: renderTraining, calendar: renderCalendar, todo: renderTodos, dreams: renderDreams, battles: renderBattles };
  function render() {
    state.matches = computeMatches();
    RENDER[state.tab]();
  }

  /* ------------------------------------------------------------- save --- */
  let saving = null;
  function save(path, body) {
    if (!state.db) return;                       // preview without storage
    const run = () => state.db.doc(path).set(body).catch(() => {});
    saving = saving ? saving.then(run) : run();  // one write at a time
  }
  const saveTodos = () => save("lists/todos", { items: state.todos });
  const saveDreams = () => save("lists/dreams", { items: state.dreams });
  const saveGames = () => save("lists/games", { items: state.games, battles: state.battles });
  const saveOverrides = () => save("state/sessions", { overrides: state.overrides });

  /* ------------------------------------------------------------ events -- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;

    if (t.dataset.view) {
      state.tab = t.dataset.view;
      document.querySelectorAll(".tabbar button").forEach((b) => b.setAttribute("aria-selected", String(b === t)));
      document.querySelectorAll(".view").forEach((v) => { v.hidden = v.id !== "v-" + state.tab; });
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (t.dataset.who) { state.who = t.dataset.who; render(); return; }
    if (t.dataset.jump) { state.week = t.dataset.jump; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.week) {
      state.week = t.dataset.week === "prev" ? addDays(state.week, -7)
        : t.dataset.week === "next" ? addDays(state.week, 7) : mondayOf(today());
      render(); window.scrollTo(0, 0); return;
    }
    if (t.dataset.tick) {
      const key = t.dataset.tick;
      const next = t.dataset.st === "done" ? "planned" : "done";
      if (next === "planned" && state.matches.has(key)) state.overrides[key] = { status: "planned" };
      else if (next === "done") state.overrides[key] = { status: "done" };
      else delete state.overrides[key];
      saveOverrides(); render(); return;
    }
    if (t.dataset.todo !== undefined) {
      const todo = state.todos[+t.dataset.todo];
      todo.done = !todo.done;
      todo.by = todo.done ? state.who : null;
      saveTodos(); render(); return;
    }
    if (t.dataset.deltodo !== undefined) { state.todos.splice(+t.dataset.deltodo, 1); saveTodos(); render(); return; }
    if (t.dataset.dream !== undefined) {
      const d = state.dreams[+t.dataset.dream];
      d.state = STATES[(STATES.indexOf(d.state) + 1) % STATES.length];
      saveDreams(); render(); return;
    }
    if (t.dataset.win) {
      const [game, winner] = t.dataset.win.split("|");
      state.battles.push({ id: "b" + Date.now(), game, winner, on: today() });
      saveGames(); render(); return;
    }
  });

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id === "add-todo") {
      const input = document.getElementById("todo-text");
      const body = input.value.trim();
      if (!body) return;
      state.todos.push({ id: "t" + Date.now(), body, who: document.getElementById("todo-who").value || null, due: null, done: false, by: null });
      saveTodos(); render();
    } else if (e.target.id === "add-dream") {
      const body = document.getElementById("dream-text").value.trim();
      if (!body) return;
      state.dreams.unshift({ id: "d" + Date.now(), title: body, note: null, category: null, state: "someday" });
      saveDreams(); render();
    } else if (e.target.id === "add-game") {
      const name = document.getElementById("game-name").value.trim();
      if (!name) return;
      state.games.push({ id: "g" + Date.now(), name, emoji: null });
      saveGames(); render();
    }
  });

  render();

  /* --------------------------------------------------------- storage --- */
  /* The page works on its own; saving lights up when the store answers.  */
  (async () => {
    const db = await (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null));
    if (!db) return;
    state.db = db;
    const badge = document.getElementById("savebadge");
    badge.textContent = "Changes saved";
    badge.dataset.on = "true";

    const watch = (path, apply) => db.doc(path).onSnapshot((snap) => {
      if (snap.exists) { apply(snap.data()); render(); }
    }, () => {});

    watch("state/sessions", (d) => { state.overrides = d.overrides || {}; });
    watch("state/activities", (d) => { state.activities = d.byPerson || { patri: [], jean: [] }; });
    watch("lists/todos", (d) => { state.todos = d.items || []; });
    watch("lists/dreams", (d) => { state.dreams = d.items || []; });
    watch("lists/games", (d) => { state.games = d.items || []; state.battles = d.battles || []; });
  })();
})();
</script>
